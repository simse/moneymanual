name: pr checks
on:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lint

  build-check:
    name: build check
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

  astro-check:
    name: astro check
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/astro-check

  test-unit:
    name: unit tests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-unit

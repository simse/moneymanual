name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build

  astro-check:
    name: astro-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/astro-check

  deploy-staging:
    name: deploy to staging
    needs: [lint, build, astro-check]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.moneymanual.org.uk
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Deploy to staging
        run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e-staging:
    name: e2e tests
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run e2e tests against staging
        run: pnpm run test:e2e:headless
        env:
          PLAYWRIGHT_BASE_URL: https://staging.moneymanual.org.uk

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-prod:
    name: deploy to prod
    needs: [e2e-staging]
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://moneymanual.org.uk
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Deploy to prod
        run: pnpm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

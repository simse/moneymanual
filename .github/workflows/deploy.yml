name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lint

  build:
    name: build
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

  test-unit:
    name: unit tests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-unit

  deploy-staging:
    name: deploy to staging
    needs: [lint, build, astro-check, test-unit]
    runs-on: ubuntu-26.04-arm
    environment:
      name: staging
      url: https://staging.moneymanual.org.uk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Deploy to staging
        run: pnpm run deploy:staging
        env:
          SITE_URL: https://staging.moneymanual.org.uk
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync staging search index
        run: pnpm run search:sync
        env:
          TYPESENSE_API_URL: ${{ secrets.TYPESENSE_API_URL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_INDEX_NAME: moneymanual-staging

  deploy-prod:
    name: deploy to prod
    needs: [lint, build, astro-check, test-unit]
    runs-on: ubuntu-26.04-arm
    environment:
      name: prod
      url: https://moneymanual.org.uk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Deploy to prod
        run: pnpm run deploy:prod
        env:
          SITE_URL: https://moneymanual.org.uk
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync production search index
        run: pnpm run search:sync
        env:
          TYPESENSE_API_URL: ${{ secrets.TYPESENSE_API_URL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_INDEX_NAME: moneymanual-prod
